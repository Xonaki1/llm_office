name: Scheduled audit

# A new CVE lands against dependencies that have not changed, so the audit runs
# on a clock as well as on every push. Without this a quiet week means an
# unpatched advisory sits undetected.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit Python dependencies
        id: python
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # --skip-editable passes over this project itself, which is not on
          # PyPI and cannot be audited. Without --strict a skipped package is
          # not an error, while a real advisory still fails the job.
          pip-audit --desc --skip-editable

      - name: Audit npm dependencies
        id: npm
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Open an issue when an advisory is found
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Dependency audit failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security",
            });
            // Reuse the open issue rather than filing a new one every week.
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `The scheduled audit failed again: ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["security"],
                body: `The scheduled dependency audit failed.\n\nRun: ${url}`,
              });
            }
