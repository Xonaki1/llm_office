name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to main always finish so
  # every commit on the default branch has a recorded result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Values only for CI. The application refuses to start in production without
  # real ones; these exist so settings validation passes in the test env.
  # Must decode to exactly 32 bytes or envelope encryption refuses to start.
  MASTER_KEYS: Y2ktb25seS1rZXktbm90LWEtcmVhbC1zZWNyZXQtMDA=
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real-000000
  ENV: test

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Mypy
        run: mypy core api worker

      - name: Tests
        # The suite runs on in-memory SQLite and a fake Redis, so it needs no
        # services and stays fast enough to gate every push.
        run: pytest -q --cov=core --cov=api --cov=worker --cov-report=term-missing

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U office"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://office:office@localhost:5432/office
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Check for schema drift
        # Fails when the models have changed without a matching migration —
        # the mismatch that only shows up on a real deployment otherwise.
        run: alembic check

      - name: Seed data, then downgrade and re-upgrade
        # Migrations must survive a table that already has rows: adding a
        # NOT NULL column without a server default passes on an empty database
        # and fails on a live one.
        run: |
          python -m scripts.seed --email ci@example.com --password 'ci-only-passphrase-1234'
          alembic downgrade base
          alembic upgrade head

  package:
    name: Package (wheel completeness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl

      - name: Import every shipped module
        # The Docker image is built from the wheel, so a package missing from
        # pyproject's `packages` list yields an image that is silently
        # incomplete. Running outside the repository is what makes this real:
        # from the source tree the missing module would import anyway.
        working-directory: /tmp
        run: /tmp/clean/bin/python -m scripts.verify_package

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # --skip-editable passes over this project itself, which is not on
          # PyPI and cannot be audited. Without --strict a skipped package is
          # not an error, while a real advisory still fails the job.
          pip-audit --desc --skip-editable

      - name: Audit npm dependencies
        working-directory: web
        # `npm ci` first so the audit reflects the locked tree, not a fresh resolve.
        run: |
          npm ci
          npm audit --audit-level=high

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, migrations, package, frontend, docker, audit]
    if: always()
    steps:
      - name: Verify every job succeeded
        # A single required check for branch protection. `needs` alone would let
        # a skipped or cancelled job read as success.
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed ($result)"
              exit 1
            fi
          done
          echo "all jobs succeeded"
