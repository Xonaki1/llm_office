[project]
name = "agents-office"
version = "1.0.0"
description = "AI office: multi-agent workflows across Anthropic, OpenAI, xAI and Google models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "anthropic>=0.69",
    "openai>=1.60",
    "google-genai>=1.0",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "tenacity>=9.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "api",
    "api.routers",
    "core",
    "core.llm",
    "core.llm.providers",
    "core.orchestration",
    "worker",
    "scripts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S106"]
# Autogenerated by Alembic; formatting is Alembic's, not ours.
"migrations/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
